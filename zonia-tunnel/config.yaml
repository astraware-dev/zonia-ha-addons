name: Zonia
version: "2.2.0"
slug: zonia_tunnel
description: Conecta esta casa a Zonia (monitoreo de energía + acceso remoto seguro) con un código de activación.
url: https://github.com/astraware-dev/zonia-ha-addons
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: services
boot: auto
# Permisos (los mínimos para automatizar el alta):
#  - homeassistant_api: leer los estados de los sensores y los registros de
#    dispositivos/entidades/áreas (WebSocket de HA, para el inventario).
#  - hassio_api + rol homeassistant: validar la configuración y reiniciar HA
#    después de agregar el bloque http:, y limpiar el código ya usado.
#  - homeassistant_config:rw: editar configuration.yaml (solo agrega el bloque
#    http: si no existe, con backup y rollback).
homeassistant_api: true
hassio_api: true
hassio_role: homeassistant
map:
  - homeassistant_config:rw
options:
  activation_code: ""
schema:
  activation_code: "str?"
  # Modo manual/legado (altas hechas con manage-tunnel-user.sh): solo túnel.
  tenant_id: "match(^[a-z0-9][a-z0-9_-]{1,62}$)?"
  token: "password?"
  server: "str?"
  server_port: "port?"
